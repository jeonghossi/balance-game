<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>밸런스 게임</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f2ff;
    --card: #ffffff;
    --text: #222;
    --sub: #777;
    --a: #ff6b81;
    --b: #4dabf7;
    --accent: #6c5ce7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16151f; --card: #23222f; --text: #eee; --sub: #999; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 560px; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 20px; }
  h1 { font-size: 1.5rem; color: var(--accent); }
  .status { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--card); color: var(--sub); }
  .status.off { color: #e67700; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .progress { font-size: .9rem; color: var(--sub); text-align: center; margin-bottom: 8px; }
  .bar { height: 6px; background: rgba(128,128,128,.2); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice {
    border: none; border-radius: 16px; padding: 28px 16px;
    font-size: 1.15rem; font-weight: 700; color: #fff; cursor: pointer;
    transition: transform .15s, opacity .2s; word-break: keep-all; line-height: 1.4;
  }
  .choice:active { transform: scale(.97); }
  .choice.a { background: var(--a); }
  .choice.b { background: var(--b); }
  .choice.dim { opacity: .45; }
  .choice { position: relative; overflow: hidden; }
  .choice .label, .choice .pct { position: relative; z-index: 1; display: block; }
  .choice .pct { font-size: .95rem; font-weight: 600; margin-top: 6px; }
  .choice .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: rgba(255,255,255,.28); transition: width .6s ease-out;
  }
  .choice.picked { outline: 4px solid var(--accent); outline-offset: 2px; }
  .note { text-align: center; color: var(--sub); font-size: .85rem; margin-top: 12px; min-height: 1.2em; }
  .stat { color: var(--sub); font-size: .8rem; font-weight: 400; }
  .vs { text-align: center; font-weight: 900; font-size: 1.3rem; color: var(--sub); }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600;
    cursor: pointer; background: var(--accent); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .hidden { display: none !important; }
  .result-list { list-style: none; margin: 16px 0; }
  .result-list li { padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,.2); font-size: .95rem; }
  .result-list .q { color: var(--sub); font-size: .8rem; }
  .pick-a { color: var(--a); font-weight: 700; }
  .pick-b { color: var(--b); font-weight: 700; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.4);
    background: var(--bg); color: var(--text); font-size: 1rem; margin-top: 8px;
  }
  label { font-size: .9rem; color: var(--sub); display: block; margin-top: 12px; }
  .custom-list { list-style: none; margin-top: 12px; max-height: 200px; overflow-y: auto; }
  .custom-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; font-size: .9rem; border-bottom: 1px solid rgba(128,128,128,.2); }
  .custom-list button { border: none; background: none; color: #e03131; cursor: pointer; font-size: 1rem; }
  h2 { font-size: 1.2rem; margin-bottom: 8px; }
  p.sub { color: var(--sub); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚖️ 밸런스 게임</h1>
    <span id="net" class="status">온라인</span>
  </header>

  <!-- 시작 화면 -->
  <section id="start" class="card">
    <h2>둘 중 하나만 고르세요!</h2>
    <p class="sub">고르고 나면 다른 사람들은 무엇을 골랐는지 비율을 보여 줘요. 직접 만든 질문도 추가할 수 있어요.</p>
    <label for="count">문제 수</label>
    <input id="count" type="number" min="1" value="10">
    <div class="row">
      <button class="btn" id="startBtn">시작하기</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="editBtn">질문 추가/관리</button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="card hidden">
    <div class="progress" id="progress"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="choices">
      <button class="choice a" id="optA"><div class="fill"></div><span class="label"></span><span class="pct"></span></button>
      <div class="vs">VS</div>
      <button class="choice b" id="optB"><div class="fill"></div><span class="label"></span><span class="pct"></span></button>
    </div>
    <p class="note" id="note"></p>
    <div class="row">
      <button class="btn hidden" id="nextBtn">다음 →</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="card hidden">
    <h2>🎉 결과</h2>
    <p class="sub" id="summary"></p>
    <ul class="result-list" id="resultList"></ul>
    <div class="row">
      <button class="btn" id="againBtn">다시 하기</button>
      <button class="btn ghost" id="homeBtn">처음으로</button>
    </div>
  </section>

  <!-- 질문 관리 화면 -->
  <section id="edit" class="card hidden">
    <h2>✏️ 내 질문 만들기</h2>
    <label for="newA">선택지 A</label>
    <input id="newA" placeholder="예: 평생 여름">
    <label for="newB">선택지 B</label>
    <input id="newB" placeholder="예: 평생 겨울">
    <div class="row">
      <button class="btn" id="addBtn">추가</button>
    </div>
    <ul class="custom-list" id="customList"></ul>
    <div class="row">
      <button class="btn ghost" id="backBtn">돌아가기</button>
    </div>
  </section>
</div>

<script>
const BASE_QUESTIONS = [
  ["q01", "평생 여름", "평생 겨울"],
  ["q02", "평생 라면 금지", "평생 치킨 금지"],
  ["q03", "투명인간 되기", "하늘 날기"],
  ["q04", "과거로 가기", "미래로 가기"],
  ["q05", "10억 받고 무인도 1년", "그냥 지금처럼 살기"],
  ["q06", "모든 언어 가능", "모든 악기 연주 가능"],
  ["q07", "매일 1시간 일찍 일어나기", "매일 1시간 늦게 자기"],
  ["q08", "친구 100명", "진짜 친구 1명"],
  ["q09", "평생 폰 없이 살기", "평생 컴퓨터 없이 살기"],
  ["q10", "생각이 다 들리는 능력", "미래가 보이는 능력"],
  ["q11", "짜장면", "짬뽕"],
  ["q12", "부먹", "찍먹"],
  ["q13", "바다 여행", "산 여행"],
  ["q14", "엄청 똑똑하기", "엄청 잘생기기/예쁘기"],
  ["q15", "잠 안 자도 되는 몸", "안 먹어도 되는 몸"],
  ["q16", "여름에 패딩 입기", "겨울에 반팔 입기"],
  ["q17", "좋아하는 노래 한 곡만 평생 듣기", "평생 노래 못 듣기"],
  ["q18", "순간이동", "시간 멈추기"],
  ["q19", "강아지", "고양이"],
  ["q20", "민트초코 평생 먹기", "하와이안 피자 평생 먹기"],
  ["q21", "숙제 없는 학교", "시험 없는 학교"],
  ["q22", "말할 때마다 노래로 하기", "걸을 때마다 춤추기"],
  ["q23", "100살까지 평범하게", "50살까지 원하는 대로"],
  ["q24", "와이파이 없는 호텔", "에어컨 없는 호텔"],
  ["q25", "탕수육", "깐풍기"]
];
// 질문을 추가할 때는 새 번호(q26, q27 …)를 붙이세요. 이미 있는 번호를 바꾸면 그 질문의 투표 기록이 사라져요.

// 투표 수는 무료 숫자 세기 서비스 Abacus(https://abacus.jasoncameron.dev)에 모아요.
// 질문마다 "q01-a", "q01-b" 같은 숫자 두 개를 써요. 빈 문자열로 두면 비율 기능이 꺼져요.
const COUNTER_URL = "https://abacus.jasoncameron.dev";
const COUNTER_NS = "jeonghossi-balance-game";

const STORE_KEY = "balance-custom-questions";
const VOTED_KEY = "balance-voted";     // 이 기기에서 이미 투표한 질문 { id: "a" | "b" }
const PENDING_KEY = "balance-pending"; // 아직 서버에 못 보낸 투표 [{ id, side }]
const $ = id => document.getElementById(id);

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function loadCustom() { return load(STORE_KEY, []); }
function saveCustom(list) { save(STORE_KEY, list); }

// ----- 투표 집계 -----
let votes = {}; // 서버에서 받아 온 { id: { a, b } } (받아 온 질문만 들어 있어요)
let voted = load(VOTED_KEY, {});
let pending = load(PENDING_KEY, []);
const counterKey = (id, side) => `${COUNTER_URL}/%s/${COUNTER_NS}/${id}-${side}`;

// 한 질문의 숫자 하나를 읽어요. 아직 아무도 안 골랐으면(404) 0이에요.
async function getCount(id, side) {
  const res = await fetch(counterKey(id, side).replace("%s", "get"), { cache: "no-store" });
  if (res.status === 404) return 0;
  if (!res.ok) throw new Error(res.status);
  return (await res.json()).value || 0;
}

// 질문 하나의 집계를 받아 와요. 받아 오면 true.
async function fetchVotes(id) {
  if (!COUNTER_URL || !id || !navigator.onLine) return false;
  try {
    const [a, b] = await Promise.all([getCount(id, "a"), getCount(id, "b")]);
    votes[id] = { a, b };
    return true;
  } catch (e) {
    console.warn("투표 집계를 불러오지 못했어요:", e);
    return false;
  }
}

let flushing = false;
async function flushVotes() {
  if (!COUNTER_URL || !navigator.onLine || flushing) return;
  flushing = true;
  try {
    while (pending.length) {
      const { id, side } = pending[0];
      const res = await fetch(counterKey(id, side).replace("%s", "hit"), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const { value } = await res.json();
      if (votes[id] && typeof value === "number") votes[id][side] = value;
      pending.shift();
      save(PENDING_KEY, pending);
    }
  } catch (e) {
    console.warn("투표를 보내지 못했어요. 나중에 다시 보낼게요:", e);
    setTimeout(flushVotes, 5000);
  } finally {
    flushing = false;
  }
}

// 같은 기기에서는 질문마다 처음 고른 것만 집계해요.
function recordVote(id, side) {
  if (voted[id]) return false;
  voted[id] = side;
  save(VOTED_KEY, voted);
  pending.push({ id, side });
  save(PENDING_KEY, pending);
  if (votes[id]) votes[id][side] = (votes[id][side] || 0) + 1;
  flushVotes();
  return true;
}

// 화면 순서(0: 위, 1: 아래)를 저장용 "a" / "b"로
function origSide(q, side) { return (q.flipped ? 1 - side : side) === 0 ? "a" : "b"; }

// 화면에 보이는 순서 기준의 [위 표수, 아래 표수]
// tentative: 아직 확정 전인 내 선택(화면 순서)도 미리 더해서 보여 줘요
function countsFor(q, tentative) {
  if (!q.id || !votes[q.id]) return null;
  const v = { ...votes[q.id] };
  if (tentative !== undefined && !voted[q.id]) {
    const s = origSide(q, tentative);
    v[s] = (v[s] || 0) + 1;
  }
  const c = [v.a || 0, v.b || 0];
  return q.flipped ? [c[1], c[0]] : c;
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

let custom = loadCustom();
let round = [];
let index = 0;
let picks = [];

function show(id) {
  ["start", "game", "result", "edit"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  const all = BASE_QUESTIONS.map(([id, a, b]) => ({ id, opts: [a, b] }))
    .concat(custom.map(([a, b]) => ({ id: null, opts: [a, b] })));
  const n = Math.max(1, Math.min(all.length, parseInt($("count").value) || 10));
  // 선택지 위/아래 순서도 무작위로
  round = shuffle(all).slice(0, n).map(q => {
    const flipped = Math.random() < .5;
    return { ...q, flipped, opts: flipped ? [q.opts[1], q.opts[0]] : q.opts };
  });
  index = 0;
  picks = [];
  show("game");
  renderQuestion();
  flushVotes();
}

// 문제가 나오면 그 질문의 최신 집계를 받아 와요. 이미 골랐으면 받아 온 숫자로 다시 보여 줘요.
// 서버가 바쁘면(요청 한도: 10초에 30번) 몇 초 뒤 다시 시도해요.
const loading = new Set();
const retries = {};
function loadVotesFor(q) {
  if (!q.id || loading.has(q.id)) return;
  loading.add(q.id);
  fetchVotes(q.id).then(ok => {
    loading.delete(q.id);
    const current = round[index] === q;
    if (!ok && current && navigator.onLine && (retries[q.id] = (retries[q.id] || 0) + 1) <= 3) {
      setTimeout(() => { if (round[index] === q) loadVotesFor(q); }, 4000);
    }
    if (current && picks[index] !== undefined) renderStats();
  });
}

function renderQuestion() {
  const q = round[index];
  $("progress").textContent = `${index + 1} / ${round.length}`;
  $("barFill").style.width = `${(index / round.length) * 100}%`;
  ["optA", "optB"].forEach((btnId, i) => {
    const btn = $(btnId);
    btn.querySelector(".label").textContent = q.opts[i];
    btn.querySelector(".pct").textContent = "";
    btn.querySelector(".fill").style.width = "0";
    btn.classList.remove("dim", "picked");
  });
  $("note").textContent = "";
  $("nextBtn").classList.add("hidden");
  if (q.id && !votes[q.id]) retries[q.id] = 0;
  loadVotesFor(q);
}

// "다음"을 누르기 전까지는 다른 쪽을 눌러 바꿀 수 있어요. 투표는 "다음"을 누를 때 확정돼요.
function choose(side) {
  const q = round[index];
  if (picks[index] === side) return;
  picks[index] = side;
  $(side === 0 ? "optA" : "optB").classList.add("picked");
  $(side === 0 ? "optA" : "optB").classList.remove("dim");
  $(side === 0 ? "optB" : "optA").classList.add("dim");
  $(side === 0 ? "optB" : "optA").classList.remove("picked");
  renderStats();
  $("nextBtn").textContent = index + 1 < round.length ? "다음 →" : "결과 보기";
  $("nextBtn").classList.remove("hidden");
}

// 고른 뒤 두 선택지의 비율과 안내 문구를 보여 줘요
function renderStats() {
  const q = round[index];
  const side = picks[index];
  let note = "";
  if (q.id && voted[q.id]) {
    note = "이 질문은 전에 투표해서, 처음 고른 답으로 집계돼 있어요.";
  } else if (!q.id) {
    note = "내가 만든 질문은 다른 사람과 비율을 비교할 수 없어요.";
  }

  const c = countsFor(q, side);
  if (c) {
    const total = c[0] + c[1];
    ["optA", "optB"].forEach((btnId, i) => {
      const btn = $(btnId);
      btn.querySelector(".pct").textContent = `${pct(c[i], total)}% · ${c[i]}명`;
      btn.querySelector(".fill").style.width = `${pct(c[i], total)}%`;
    });
    if (!note) note = `지금까지 ${total}명이 골랐어요. 다음을 누르기 전에는 바꿀 수 있어요.`;
  } else if (q.id && COUNTER_URL) {
    note = !navigator.onLine
      ? "인터넷에 연결되면 다른 사람들의 선택 비율을 볼 수 있어요."
      : loading.has(q.id) || (retries[q.id] || 0) <= 3
        ? "다른 사람들의 선택을 불러오는 중이에요…"
        : "지금은 다른 사람들의 선택을 불러오지 못했어요. 내 선택은 저장돼요.";
  }
  $("note").textContent = note || "다음을 누르기 전에는 바꿀 수 있어요.";
}

function next() {
  const q = round[index];
  if (picks[index] === undefined) return;
  if (q.id) recordVote(q.id, origSide(q, picks[index]));
  index++;
  if (index < round.length) renderQuestion();
  else showResult();
}

function showResult() {
  $("barFill").style.width = "100%";
  const aCount = picks.filter(p => p === 0).length;
  $("summary").textContent = `총 ${round.length}문제 · 위쪽 선택 ${aCount}번 · 아래쪽 선택 ${round.length - aCount}번`;
  const list = $("resultList");
  list.innerHTML = "";
  round.forEach((q, i) => {
    const li = document.createElement("li");
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.textContent = `${q.opts[0]} vs ${q.opts[1]}`;
    const pick = document.createElement("div");
    pick.className = picks[i] === 0 ? "pick-a" : "pick-b";
    pick.textContent = "👉 " + q.opts[picks[i]];
    const c = countsFor(q);
    if (c) {
      const stat = document.createElement("span");
      stat.className = "stat";
      stat.textContent = ` · ${c[0] + c[1]}명 중 ${pct(c[picks[i]], c[0] + c[1])}%가 같은 선택`;
      pick.appendChild(stat);
    }
    li.append(qDiv, pick);
    list.appendChild(li);
  });
  show("result");
}

function renderCustom() {
  const list = $("customList");
  list.innerHTML = "";
  if (custom.length === 0) {
    const li = document.createElement("li");
    li.textContent = "아직 추가한 질문이 없어요.";
    list.appendChild(li);
    return;
  }
  custom.forEach((q, i) => {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = `${q[0]} vs ${q[1]}`;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "삭제";
    del.onclick = () => { custom.splice(i, 1); saveCustom(custom); renderCustom(); };
    li.append(span, del);
    list.appendChild(li);
  });
}

function addCustom() {
  const a = $("newA").value.trim();
  const b = $("newB").value.trim();
  if (!a || !b) { alert("두 선택지를 모두 입력해 주세요."); return; }
  custom.push([a, b]);
  saveCustom(custom);
  $("newA").value = "";
  $("newB").value = "";
  renderCustom();
}

$("startBtn").onclick = startGame;
$("againBtn").onclick = startGame;
$("homeBtn").onclick = () => show("start");
$("editBtn").onclick = () => { renderCustom(); show("edit"); };
$("backBtn").onclick = () => show("start");
$("addBtn").onclick = addCustom;
$("newB").addEventListener("keydown", e => { if (e.key === "Enter") addCustom(); });
$("optA").onclick = () => choose(0);
$("optB").onclick = () => choose(1);
$("nextBtn").onclick = next;

// 온라인/오프라인 표시
function updateNet() {
  const off = !navigator.onLine;
  $("net").textContent = off ? "오프라인" : "온라인";
  $("net").classList.toggle("off", off);
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);
updateNet();

// 오프라인일 때 쌓인 투표는 연결되면 보내요
window.addEventListener("online", () => {
  flushVotes();
  if (!$("game").classList.contains("hidden")) loadVotesFor(round[index]);
});
flushVotes();

// 오프라인 지원: 서비스 워커 등록
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW 등록 실패:", err));
  });
}
</script>
</body>
</html>
